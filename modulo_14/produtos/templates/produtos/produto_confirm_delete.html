<!-- produtos/templates/produtos/produto_confirm_delete.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Produto</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1170/1170576.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card border-danger p-4">
        <h2 class="text-danger">Atenção!</h2>
        <p>Tem certeza que deseja excluir permanentemente o produto <strong>{{ object.nome }}</strong>?</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, Excluir</button>
            <a href="{% url 'produto_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
