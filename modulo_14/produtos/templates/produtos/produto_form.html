<!-- produtos/templates/produtos/produto_form.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Editar{% else %}Cadastrar{% endif %} Produto</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1170/1170576.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>{% if object %}Editar Produto: {{ object.nome }}{% else %}Cadastrar Novo Produto{% endif %}</h2>
    <hr>
    
    <!-- O 'method="post"' envia os dados de forma segura -->
    <form method="post" class="mt-4">
        <!-- O token CSRF é uma trava de segurança obrigatória do Django contra ataques -->
        {% csrf_token %}
        
        <!-- O Django renderiza as caixas de texto formatadas automaticamente aqui -->
        {{ form.as_p }}
        
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        <a href="{% url 'produto_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
